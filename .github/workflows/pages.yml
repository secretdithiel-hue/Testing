# Publishes the website (the site/ folder) on GitHub Pages whenever main changes.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The address follows the repository: <owner>.github.io/<repo>/, or <owner>.github.io
# for a repository named <owner>.github.io (see "The website's address" in the README).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Tell the "page not found" page where the site starts
        run: sed -i 's#__SITE_BASE__#${{ steps.pages.outputs.base_path }}#' site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
